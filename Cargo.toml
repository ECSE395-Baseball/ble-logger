[package]
name = "ble-logger"
version = "0.1.0"
edition = "2021"
description = "BLE score-sync logger for the ESP-NOW timer start node"

[dependencies]
anyhow = "1"
btleplug = "0.13"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "8"
qrcode = "0.14"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "time",
] }
uuid = { version = "1", features = ["v4"] }
